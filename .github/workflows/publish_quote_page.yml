name: Publish standalone quote page
on:
  push:
    branches: [main]
    paths:
      - 'site-embed/**'
      - '.github/workflows/publish_quote_page.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: quote-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-embed
      - id: deployment
        uses: actions/deploy-pages@v4
