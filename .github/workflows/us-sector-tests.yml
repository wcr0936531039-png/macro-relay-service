name: US Sector Module Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site-embed/us-sector-*.js'
      - 'site-embed/us-sector-*.mjs'
      - 'site-embed/package.json'
      - 'scripts/us_sector_feed.py'
      - 'scripts/test_us_sector_feed.py'
      - '.github/workflows/us-sector-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test site-embed/us-sector-rotation.test.mjs site-embed/us-sector-history.test.mjs site-embed/us-sector-snapshot.test.mjs
      - run: python -m unittest discover -s scripts -p 'test_us_sector_feed.py'
