name: Keyless stock snapshot publisher
on:
  push:
    branches: [main]
    paths: ['scripts/publish_keyless_stocks.mjs', '.github/workflows/publish_keyless_stocks.yml']
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: keyless-stock-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate official stock observations
        run: node scripts/publish_keyless_stocks.mjs
      - name: Commit official stock snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stock_snapshots_v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified stock snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Explain publication status
        if: always()
        run: |
          echo '### Stock snapshot pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo 'The JSON is committed to main; this does not deploy or update the ChatGPT Site.' >> "$GITHUB_STEP_SUMMARY"
