name: OpenBB Isolated Live Parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/openbb-live-isolated.yml']
  workflow_dispatch:
    inputs:
      series:
        description: 'FRED series (comma-separated, allowlisted)'
        required: false
        default: 'DGS10,DFII10,T10YIE'
        type: string

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned experimental code (never default production)
        uses: actions/checkout@v4
        with:
          ref: 74628c323b4a03545e781057bb2a60fdbe0136ee
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/openbb-isolated"
          git rev-parse HEAD | tee "$RUNNER_TEMP/openbb-isolated/candidate-commit.txt"
          python --version | tee "$RUNNER_TEMP/openbb-isolated/python-version.txt"
      - name: Validate public CSV parser
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_openbb_public_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/public-parser-tests.log"
      - name: Probe official public CSV independently
        id: public_csv
        continue-on-error: true
        env:
          SERIES_INPUT: ${{ inputs.series || 'DGS10,DFII10,T10YIE' }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/public-csv.log"
          import os, subprocess, sys
          series = [s.strip() for s in os.environ['SERIES_INPUT'].split(',')]
          subprocess.run([sys.executable, '-m', 'integrations.fred_public_probe', *series], check=True)
          PY
      - name: Install isolated provider
        run: |
          set -o pipefail
          python -m pip install "openbb-fred==2.0.0" "openbb-core[pandas]==2.0.1" 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/install.log"
          openbb-build 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/build.log"
          python -m pip freeze > "$RUNNER_TEMP/openbb-isolated/packages.txt"
      - name: Confirm pinned candidate code and preflight
        run: |
          set -o pipefail
          python -m integrations.openbb_preflight 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/preflight.log"
          python -m unittest discover -s tests -p 'test_openbb*.py' -v 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/tests.log"
      - name: Run read-only parity check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERIES_INPUT: ${{ inputs.series || 'DGS10,DFII10,T10YIE' }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/openbb-isolated/parity.log"
          import json, os, subprocess, sys
          key = os.getenv("FRED_API_KEY", "")
          if not key:
              print(json.dumps({"status": "blocked", "reason": "FRED_API_KEY missing; no live validation performed", "published": False, "fallback_enabled": False}))
              raise SystemExit(2)
          series = [s.strip() for s in os.getenv("SERIES_INPUT", "").split(",")]
          allowed = {"DGS10", "DFII10", "T10YIE"}
          if not series or len(series) != len(set(series)) or any(s not in allowed for s in series):
              raise SystemExit("Invalid series selection")
          result = subprocess.run([sys.executable, "-m", "integrations.openbb_batch_parity", *series], capture_output=True, text=True)
          for output in (result.stdout, result.stderr):
              print(output.replace(key, "[REDACTED]"), end="")
          raise SystemExit(result.returncode)
          PY
      - name: Preserve complete isolated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbb-isolated-live-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbb-isolated/
          retention-days: 14
          if-no-files-found: warn
      - name: Record isolation boundary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'openbb-isolated'
          path = root / 'official-public-fred.json'
          public = json.loads(path.read_text()) if path.exists() else {'status': 'unknown', 'results': {}}
          common = public.get('common_date_check', {'status': 'unknown'})
          parity = {'status': 'unknown', 'reason': 'no_completed_api_report'}
          log = root / 'parity.log'
          if log.exists():
              for line in log.read_text().splitlines():
                  try:
                      parsed = json.loads(line)
                      if isinstance(parsed, dict) and 'status' in parsed:
                          parity = parsed
                  except ValueError:
                      pass
          lines = ['## OpenBB isolated live parity', '', f"Official public CSV: {public['status']}",
                   f"Same-day definition consistency: {common['status']}",
                   f"Common observation date: {common.get('as_of', 'UNKNOWN')}",
                   f"Matched historical dates: {common.get('matched_dates', 0)}/{common.get('checked_dates', 0)}",
                   f"OpenBB authenticated API: {parity['status']}",
                   f"API reason: {parity.get('reason', 'see per-series report')}", '',
                   '| Series | CSV status | Latest observation |', '| --- | --- | --- |']
          for symbol, row in public.get('results', {}).items():
              lines.append(f"| {symbol} | {row.get('status', 'unknown')} | {row.get('latest', {}).get('date', 'UNKNOWN')} |")
          lines += ['', 'CSV success does not validate OpenBB parity. No production snapshot writes. OpenBB fallback remains disabled.',
                    'Complete stage logs and the public-source JSON are retained in the run artifact.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('\n'.join(lines) + '\n')
          PY
