name: Stock data validation (manual)
on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate official TWSE response only; do not publish'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official TWSE data and optionally publish
        env:
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          ENABLE_FINMIND_FALLBACK: 'false'
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/sync_stocks.mjs
