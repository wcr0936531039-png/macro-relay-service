name: OpenBB Adapter Validation

on:
  pull_request:
    paths:
      - 'integrations/openbb_adapter.py'
      - 'tests/test_openbb_adapter.py'
      - '.github/workflows/openbb-validation.yml'
  workflow_dispatch:
    inputs:
      live_smoke:
        description: 'Run an optional live OpenBB smoke test (no publication)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline adapter contract tests
        run: python -m unittest discover -s tests -p 'test_openbb_adapter.py' -v

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenBB for isolated test
        run: python -m pip install 'openbb-fred>=5,<6'\n          openbb-build
      - name: Verify OpenBB API and FRED observation
        run: |
          python - <<'PY'
          from integrations.openbb_adapter import fetch_fred_series
          result = fetch_fred_series("DGS10")
          print({k: v for k, v in result.items() if k != "error"})
          if result["status"] != "ok":
              raise SystemExit("OpenBB live smoke failed: " + result.get("error", "unknown"))
          PY
