name: OpenBB Adapter Validation

on:
  pull_request:
    paths:
      - 'integrations/openbb_adapter.py'
      - 'tests/test_openbb_adapter.py'
      - 'integrations/openbb_arbitration.py'
      - 'tests/test_openbb_arbitration.py'
      - 'integrations/openbb_parity.py'
      - 'tests/test_openbb_parity.py'
      - 'tests/test_openbb_candidate_safety.py'
      - '.github/workflows/openbb-validation.yml'
  workflow_dispatch:
    # GitHub only discovers manual dispatch workflows from the default branch.
    # Merge this workflow separately before attempting manual dispatch.
    inputs:
      live_smoke:
        description: 'Run an optional live OpenBB smoke test (no publication)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline adapter contract tests
        run: |
          python -m unittest discover -s tests -p 'test_openbb_adapter.py' -v
          python -m unittest discover -s tests -p 'test_openbb_arbitration.py' -v
          python -m unittest discover -s tests -p 'test_openbb_parity.py' -v
          python -m unittest discover -s tests -p 'test_openbb_candidate_safety.py' -v

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify FRED credential exists
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo 'FRED_API_KEY secret is missing; live smoke cannot run.' >&2
            exit 1
          fi
      - name: Install OpenBB for isolated test
        run: |
          python -m pip install 'openbb-fred'
          openbb-build
      - name: Compare OpenBB with official FRED (read-only)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m integrations.openbb_parity DGS10
