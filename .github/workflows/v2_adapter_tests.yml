name: V2 adapter tests
on:
  pull_request:
    paths:
      - 'site-contract/**'
      - 'tests/test_report_state.mjs'
      - 'tests/test_stock_source.mjs'
      - '.github/workflows/v2_adapter_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_report_state.mjs
      - run: node tests/test_stock_source.mjs
      - run: node tests/test_assemble_report.mjs
      - run: node tests/test_twse_stock_day.mjs
