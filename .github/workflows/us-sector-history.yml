name: US Sector History
on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: us-sector-history
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_us_sector_feed.py'
      - name: Fetch market data
        run: python scripts/us_sector_feed.py
      - name: Check coverage and aligned dates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/us_sector_history.json'))
          if d.get('schema_version')!=1: raise SystemExit('Schema mismatch')
          expected={'SPY','XLK','XLC','XLY','XLP','XLF','XLI','XLV','XLE','XLB','XLU','XLRE'}
          if set(d['status'])!=expected: raise SystemExit('Ticker coverage mismatch')
          if any(d['status'][t]['status']!='ok' for t in expected): raise SystemExit('Incomplete data: do not publish')
          dates={d['status'][t]['observed_at'] for t in expected}
          if len(dates)!=1: raise SystemExit('Misaligned dates: do not publish')
          print('Validated 12/12 ETFs, observed date:',next(iter(dates)))
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/us_sector_history.json
          git diff --cached --quiet || (git commit -m 'data: update US sector history' && git push)
