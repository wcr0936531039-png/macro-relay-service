name: US Sector History
on:
  # Changes to this workflow run one live, validated publication smoke.
  # Data-only commits do not retrigger it.
  push:
    branches: [main]
    paths:
      - '.github/workflows/us-sector-history.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: us-sector-history
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_us_sector*.py'
      - name: Fetch market data
        run: python scripts/us_sector_feed.py
      - name: Validate coverage and freshness
        run: python scripts/check_us_sector_snapshot.py data/us_sector_history.json
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp data/us_sector_history.json /tmp/us-sector-history-validated.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/us-sector-history-validated.json /tmp/us-sector-publish-candidate.json
            guard_status=0
            python scripts/us_sector_publish_guard.py /tmp/us-sector-publish-candidate.json data/us_sector_history.json || guard_status=$?
            if [ "$guard_status" -eq 2 ]; then
              echo "Remote sector snapshot is newer; retaining it"
              exit 0
            fi
            if [ "$guard_status" -ne 0 ]; then
              echo "Sector snapshot guard failed" >&2
              exit "$guard_status"
            fi
            cp /tmp/us-sector-publish-candidate.json data/us_sector_history.json
            python scripts/check_us_sector_snapshot.py data/us_sector_history.json
            git add -- data/us_sector_history.json
            if git diff --cached --quiet; then
              echo "Sector history unchanged; no publication required"
              exit 0
            fi
            git commit -m 'data: update US sector history'
            if git push origin HEAD:main; then
              echo "Validated sector history published"
              exit 0
            fi
            echo "Concurrent main update: retrying only the validated sector snapshot ($attempt/3)"
          done
          echo "Publication failed after three retries; prior remote snapshot retained" >&2
          exit 1
