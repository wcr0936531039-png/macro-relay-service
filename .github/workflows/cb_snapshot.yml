name: CB registry relay
# 網站伺服器連不到櫃買／觀測站時，網站改讀這份。只抓官方檔、保存 SHA-256，不使用任何金鑰。
on:
  push:
    branches: [main]
    paths: ['scripts/sync_cb.py', 'tests/test_cb_snapshot.py', '.github/workflows/cb_snapshot.yml']
  workflow_dispatch:
  schedule:
    # 台北 08:47、17:47（櫃買每日登錄資料與觀測站月報更新後）
    - cron: '47 0,9 * * *'
permissions:
  contents: write
concurrency:
  group: cb-snapshot-publisher
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser
        run: python -m unittest tests.test_cb_snapshot -v
      - name: Fetch official CB files
        run: python scripts/sync_cb.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/cb_snapshot.json "$RUNNER_TEMP/cb_snapshot.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/cb_snapshot.json" data/cb_snapshot.json
          git add data/cb_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official CB registry relay'
            git push origin HEAD:main
          fi
